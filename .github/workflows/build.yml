name: 构建PVZ2 Android APK (原生+Chaquopy)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: 检出代码
      uses: actions/checkout@v4

    - name: 设置JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: 设置Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: 下载并安装Gradle 8.0
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.0-bin.zip
        unzip -q gradle-8.0-bin.zip
        sudo mv gradle-8.0 /opt/gradle
        echo "/opt/gradle/bin" >> $GITHUB_PATH
        gradle --version

    - name: 生成Gradle Wrapper
      run: gradle wrapper --gradle-version 8.0

    - name: 授予gradlew执行权限
      run: chmod +x gradlew

    - name: 构建Debug APK
      run: ./gradlew assembleDebug --stacktrace
      env:
        ANDROID_HOME: /usr/local/lib/android/sdk

    - name: 上传APK产物
      uses: actions/upload-artifact@v4
      with:
        name: PVZ2Tool-APK
        path: app/build/outputs/apk/debug/*.apk
        retention-days: 30
